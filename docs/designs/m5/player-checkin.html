<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>M5 · Player check-in (/t/&lt;tag&gt;) · design drafts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      /* Tokens: mirror DESIGN.md / src/app/globals.css @theme. */
      :root {
        --bg: #0f1419;
        --bg-header: #121a21;
        --bg-backdrop: #080b0e;
        --card: #182028;
        --card-border: #24303b;
        --inner: #1c2630;
        --inner-border: #2a3642;
        --nav-active: #222d37;
        --text: #f1f5f9;
        --text-muted: #9aa8b6;
        --text-soft: #d5dee7;
        --text-row: #c3cdd8;
        --placeholder: #7d8b99;
        --outline: #3a4856;
        --outline-blue: #2f4a68;
        --drag-handle: #5b6b7a;
        --link: #8cc4ff;
        --link-hover: #bfdfff;
        --lime: #d4f23a;
        --lime-surface: #1f2a14;
        --lime-edge: #4c5f14;
        --on-lime: #18200a;
        --lime-soft: #e3fa7a;
        --lime-caption: #c9d6a0;
        --lime-avatar: #2b3a12;
        --blue: #5aa9ff;
        --blue-surface: #13263c;
        --blue-edge: #2f5e8f;
        --on-blue: #06182b;
        --blue-soft: #cfe6ff;
        --blue-avatar: #1d3550;
        --grey-dot: #64748b;
        --orange: #ff9f43;
        --orange-surface: #22201a;
        --orange-surface-row: #251c12;
        --orange-surface-strong: #2b2114;
        --orange-edge: #5a4220;
        --on-orange: #2a1606;
        --orange-soft: #ffb877;
        --orange-text: #ffd6ae;
        --modal-shadow: 0 24px 64px rgba(0, 0, 0, 0.5);
        --font: Outfit, system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #05080a;
        color: var(--text);
        font-family: var(--font);
        font-size: 15px;
        line-height: 1.4;
      }
      a {
        color: var(--link);
      }
      a:hover {
        color: var(--link-hover);
      }
      button,
      input {
        font-family: inherit;
      }
      button {
        cursor: pointer;
      }
      input::placeholder {
        color: var(--placeholder);
      }
      :focus-visible {
        outline: 2px solid var(--lime);
        outline-offset: 2px;
      }
      .tabular {
        font-variant-numeric: tabular-nums;
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      /* Gallery (review page only) */
      .gallery-intro {
        padding: 32px 40px 0;
        max-width: 1400px;
      }
      .gallery-intro h1 {
        margin: 0;
        font-size: 26px;
        font-weight: 800;
      }
      .gallery-intro p {
        margin: 6px 0 0;
        color: var(--text-muted);
      }
      .gallery {
        display: flex;
        flex-wrap: wrap;
        gap: 40px 32px;
        padding: 32px 40px 64px;
        align-items: flex-start;
      }
      .frame {
        margin: 0;
        padding: 12px;
        background: #05080a;
      }
      .frame figcaption {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-muted);
        margin: 0 0 10px;
        max-width: 390px;
      }
      .frame figcaption b {
        color: var(--text);
      }

      /* Phone frame: 390 x 844 */
      .phone {
        width: 390px;
        min-height: 844px;
        background: var(--bg);
        border: 1px solid var(--card-border);
        border-radius: 28px;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        padding: 20px 20px 0;
      }
      .phone-content {
        display: flex;
        flex-direction: column;
        gap: 16px;
        flex: 1;
      }
      .cta-bar {
        margin-top: auto;
        padding: 16px 0 24px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      /* Brand line */
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 44px;
      }
      .brand span {
        font-size: 17px;
        font-weight: 700;
      }

      /* Live card */
      .live-card {
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 24px;
        padding: 18px;
      }
      .live-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: var(--lime);
        text-transform: uppercase;
      }
      .live-label::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--lime);
      }
      .live-card h1 {
        margin: 8px 0 2px;
        font-size: 26px;
        font-weight: 800;
        line-height: 1.12;
        letter-spacing: -0.01em;
      }
      .live-when {
        font-size: 14px;
        color: var(--text-muted);
      }
      .mini-stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        margin-top: 14px;
      }
      .mini-stat {
        background: var(--inner);
        border-radius: 14px;
        padding: 10px 12px;
      }
      .mini-stat b {
        display: block;
        font-size: 20px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .mini-stat span {
        font-size: 12px;
        color: var(--text-muted);
      }

      h2.section {
        margin: 4px 0 0;
        font-size: 18px;
        font-weight: 700;
      }

      /* Avatars */
      .avatar {
        flex: none;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        background: #2a3642;
        color: var(--text-soft);
        width: 36px;
        height: 36px;
        font-size: 12px;
      }
      .avatar.lg {
        width: 44px;
        height: 44px;
        font-size: 14px;
      }
      .avatar.xl {
        width: 52px;
        height: 52px;
        font-size: 16px;
      }
      .avatar.blue {
        background: var(--blue-avatar);
        color: var(--blue-soft);
      }

      /* Recognised phone card */
      .recognised {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        border-radius: 20px;
        background: var(--blue-surface);
        border: 1px solid var(--blue-edge);
        min-height: 72px;
      }
      .recognised .who {
        flex: 1;
        min-width: 0;
      }
      .recognised small {
        display: block;
        font-size: 13px;
        color: var(--link);
        font-weight: 500;
      }
      .recognised strong {
        display: block;
        font-size: 18px;
        font-weight: 700;
      }
      .check-disc {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--blue);
        color: var(--on-blue);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: none;
      }

      /* Search */
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .field label,
      .field .label {
        font-size: 13px;
        color: var(--text-muted);
        font-weight: 500;
      }
      .not-you {
        text-align: center;
        font-size: 14px;
        color: var(--text-muted);
      }
      .search {
        position: relative;
      }
      .search svg {
        position: absolute;
        left: 14px;
        top: 15px;
        color: var(--text-muted);
      }
      .input {
        width: 100%;
        height: 48px;
        border-radius: 14px;
        border: 1px solid var(--inner-border);
        background: var(--inner);
        color: var(--text);
        padding: 0 14px;
        font-size: 16px;
      }
      .search .input {
        padding-left: 42px;
      }
      .input.invalid {
        border: 2px solid var(--orange);
      }
      .hint {
        font-size: 13px;
        color: var(--text-muted);
      }

      .name-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .name-row {
        width: 100%;
        min-height: 52px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        border-radius: 16px;
        border: 1px solid var(--inner-border);
        background: var(--inner);
        color: var(--text);
        font-size: 15px;
        font-weight: 600;
        text-align: left;
      }
      .name-row .chev {
        margin-left: auto;
        color: var(--text-muted);
      }
      .name-row mark {
        background: none;
        color: var(--lime-soft);
      }

      .guest-link {
        display: flex;
        justify-content: center;
      }
      .link-button {
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        background: none;
        border: 0;
        color: var(--link);
        font-size: 15px;
        font-weight: 600;
        text-decoration: underline;
        text-underline-offset: 3px;
        padding: 0 4px;
      }

      /* Buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border: 0;
        font-family: inherit;
      }
      .btn-primary {
        height: 56px;
        width: 100%;
        border-radius: 16px;
        background: var(--lime);
        color: var(--on-lime);
        font-size: 17px;
        font-weight: 800;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }
      .btn-outline {
        height: 52px;
        width: 100%;
        border-radius: 16px;
        background: transparent;
        border: 1px solid var(--outline);
        color: var(--text);
        font-size: 16px;
        font-weight: 600;
      }
      .btn-secondary {
        height: 52px;
        width: 100%;
        border-radius: 16px;
        background: var(--blue);
        color: var(--on-blue);
        font-size: 16px;
        font-weight: 700;
      }

      /* Notices */
      .notice {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        border-radius: 16px;
        padding: 12px 14px;
        font-size: 14px;
      }
      .notice.no-match {
        background: var(--inner);
        border: 1px solid var(--inner-border);
        color: var(--text-soft);
      }
      .notice.info {
        background: var(--inner);
        border: 1px solid var(--inner-border);
        color: var(--text-soft);
      }
      .badge-i {
        flex: none;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--inner-border);
        color: var(--text);
        font-size: 12px;
        font-weight: 800;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 1px;
      }
      .badge-bang {
        flex: none;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--orange);
        color: var(--on-orange);
        font-size: 12px;
        font-weight: 800;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      /* Skill option buttons */
      .options {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        border-radius: 14px;
      }
      .options.invalid {
        outline: 2px solid var(--orange);
        outline-offset: 4px;
      }
      .option {
        height: 44px;
        border-radius: 12px;
        background: var(--inner);
        border: 1px solid var(--inner-border);
        color: var(--text);
        font-size: 14px;
        font-weight: 600;
        padding: 0 6px;
      }
      .option[aria-pressed="true"] {
        background: var(--lime);
        color: var(--on-lime);
        border-color: var(--lime);
        font-weight: 700;
      }
      .field-error {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--orange-soft);
        font-weight: 500;
      }
      .field-error .badge-bang {
        width: 16px;
        height: 16px;
        font-size: 10px;
      }

      .skill-chip {
        font-size: 12px;
        font-weight: 600;
        padding: 3px 8px;
        border-radius: 999px;
        background: #2a3642;
        color: var(--text-soft);
      }

      /* Bottom sheet */
      .backdrop {
        position: absolute;
        inset: 0;
        background: rgba(8, 11, 14, 0.78);
      }
      .sheet {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--card);
        border-top: 1px solid var(--inner-border);
        border-radius: 28px 28px 0 0;
        box-shadow: var(--modal-shadow);
        padding: 24px 20px 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .sheet h2 {
        margin: 0;
        font-size: 26px;
        font-weight: 800;
        line-height: 1.15;
      }
      .sheet .sub {
        margin: 4px 0 0;
        color: var(--text-muted);
        font-size: 14px;
      }
      .identity {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px;
        border-radius: 18px;
        background: var(--inner);
        border: 1px solid var(--inner-border);
      }
      .identity strong {
        display: block;
        font-size: 18px;
        font-weight: 700;
      }
      .identity small {
        display: block;
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 2px;
      }
      .identity .row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 4px;
      }
      .disclosure {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        min-height: 48px;
        padding: 0 14px;
        border-radius: 14px;
        background: transparent;
        border: 1px solid var(--outline);
        color: var(--text);
        font-size: 15px;
        font-weight: 600;
      }
      .disclosure span small {
        color: var(--text-muted);
        font-weight: 500;
      }

      /* State screens */
      .state {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 14px;
        padding: 36px 4px 0;
      }
      .state-icon {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .state-icon.blue {
        background: var(--blue-surface);
        border: 2px solid var(--blue-edge);
        color: var(--link);
      }
      .state-icon.lime {
        background: var(--lime);
        color: var(--on-lime);
      }
      .state-icon.neutral {
        background: var(--inner);
        border: 2px solid var(--outline);
        color: var(--text-soft);
      }
      .state-icon.orange {
        background: var(--orange-surface-strong);
        border: 2px solid var(--orange-edge);
        color: var(--orange);
      }
      .state h1 {
        margin: 0;
        font-size: 26px;
        font-weight: 800;
        line-height: 1.15;
        letter-spacing: -0.01em;
      }
      .state p {
        margin: 0;
        color: var(--text-soft);
        font-size: 16px;
      }
      .state p.muted {
        color: var(--text-muted);
        font-size: 14px;
      }
      .panel {
        width: 100%;
        text-align: left;
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 20px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .panel h2 {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
      }
      .panel ul {
        margin: 0;
        padding-left: 18px;
        color: var(--text-soft);
        font-size: 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .person {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .person strong {
        display: block;
        font-size: 17px;
        font-weight: 700;
      }
      .person small {
        display: block;
        font-size: 13px;
        color: var(--text-muted);
      }
      .poll-line {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--link);
        font-weight: 600;
      }
      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
      }
      .status-pill.blue {
        background: var(--blue-surface);
        color: var(--blue-soft);
        border: 1px solid var(--blue-edge);
      }
      .status-pill.lime {
        background: var(--lime-surface);
        color: var(--lime-soft);
        border: 1px solid var(--lime-edge);
      }
      .back-row {
        display: flex;
        align-items: center;
      }
      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 44px;
        background: none;
        border: 0;
        color: var(--link);
        font-size: 15px;
        font-weight: 600;
        padding: 0;
      }
      .page-title {
        margin: 0;
        font-size: 26px;
        font-weight: 800;
        line-height: 1.15;
      }
      .lede {
        margin: 4px 0 0;
        color: var(--text-muted);
        font-size: 14px;
      }
      .form-card {
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 24px;
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .error-summary {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        background: var(--orange-surface);
        border: 1px solid var(--orange-edge);
        border-radius: 14px;
        padding: 10px 14px;
        color: var(--orange-text);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <!-- Shared fragments, cloned into frames by the script at the bottom. -->
    <template id="tpl-brand">
      <div class="brand">
        <svg width="40" height="40" viewBox="0 0 52 52" aria-hidden="true">
          <circle cx="26" cy="26" r="24" fill="#D4F23A" />
          <circle cx="18" cy="18" r="3" fill="#0F1419" />
          <circle cx="30" cy="15" r="3" fill="#0F1419" />
          <circle cx="36" cy="27" r="3" fill="#0F1419" />
          <circle cx="25" cy="34" r="3" fill="#0F1419" />
          <circle cx="15" cy="29" r="3" fill="#0F1419" />
          <circle cx="26" cy="24" r="3" fill="#0F1419" />
        </svg>
        <span>Riverside Pickleball Club</span>
      </div>
    </template>
    <template id="tpl-live-card">
      <section class="live-card" aria-labelledby="session-title">
        <div class="live-label">Live now</div>
        <h1 id="session-title">Saturday Social Pickleball</h1>
        <div class="live-when tabular">
          Sat 7 Nov · 18:00 – 20:00 · 80 min left
        </div>
        <div class="mini-stats">
          <div class="mini-stat"><b>4</b><span>courts</span></div>
          <div class="mini-stat"><b>26</b><span>checked in</span></div>
          <div class="mini-stat"><b>~6m</b><span>to first game</span></div>
        </div>
      </section>
    </template>
    <template id="tpl-search-empty">
      <div class="field">
        <label for="name-search" class="visually-hidden">Find your name</label>
        <div class="search">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <circle cx="11" cy="11" r="7" />
            <path d="M20 20l-3.5-3.5" />
          </svg>
          <input
            class="input"
            id="name-search"
            type="search"
            autocomplete="off"
            placeholder="Type your name"
            aria-describedby="name-search-hint"
          />
        </div>
        <div class="hint" id="name-search-hint">
          Type at least 2 letters of your name
        </div>
      </div>
    </template>
    <template id="tpl-guest-link">
      <div class="guest-link">
        <button class="link-button" type="button">
          Not a member? Check in as a guest
        </button>
      </div>
    </template>

    <div class="gallery-intro">
      <h1>M5 · Player check-in at /t/&lt;tag&gt; (390 px)</h1>
      <p>
        Draft screens for review. Public page, no login. Names never appear
        before 2 typed letters, at most 5, names only, never anyone's check-in
        status.
      </p>
    </div>

    <div class="gallery">
      <!-- P1 -->
      <figure class="frame" data-shot="P01-welcome-recognised">
        <figcaption>
          <b>P1 · Welcome, recognised phone.</b> This phone is linked to a
          member of this social. Only that member is shown.
        </figcaption>
        <div class="phone">
          <div class="phone-content">
            <div data-include="tpl-brand"></div>
            <div data-include="tpl-live-card"></div>
            <h2 class="section">Who's checking in?</h2>
            <div class="recognised">
              <span class="avatar lg blue" aria-hidden="true">GK</span>
              <div class="who">
                <small>This phone was used by</small><strong>Grace Kim</strong>
              </div>
              <span class="check-disc" aria-hidden="true"
                ><svg
                  width="15"
                  height="15"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="3"
                  stroke-linecap="round"

    <script>
      // Clone shared fragments (keeps the mockup DRY). Duplicate ids inside clones get a suffix.
      let includeCounter = 0;
      for (const placeholder of document.querySelectorAll("[data-include]")) {
        const fragment = document
          .getElementById(placeholder.dataset.include)
          .content.cloneNode(true);
        includeCounter += 1;
        for (const element of fragment.querySelectorAll("[id]"))
          element.id += "-" + includeCounter;
        for (const element of fragment.querySelectorAll("[for]"))
          element.htmlFor += "-" + includeCounter;
        for (const element of fragment.querySelectorAll("[aria-describedby]"))
          element.setAttribute(
            "aria-describedby",
            element.getAttribute("aria-describedby") + "-" + includeCounter,
          );
        for (const element of fragment.querySelectorAll("[aria-labelledby]"))
          element.setAttribute(
            "aria-labelledby",
            element.getAttribute("aria-labelledby") + "-" + includeCounter,
          );
        placeholder.replaceWith(fragment);
      }
    </script>
